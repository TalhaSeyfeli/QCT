<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QCT - Receive File</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .container {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        #status-text {
            font-size: 22px;
            margin-bottom: 20px;
            color: #111;
            font-weight: 600;
        }

        /* İndirme Çubuğu (Progress Bar) Tasarımı */
        #progress-container {
            display: none; /* Başlangıçta gizli, transfer başlayınca açılacak */
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 20px;
            height: 20px;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background-color: #34c759; /* iOS Yeşil tonu */
            transition: width 0.3s ease;
        }

        #progress-percentage {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="status-text">Connecting...</h1>
        
        <div id="progress-container">
            <div id="progress-bar"></div>
        </div>
        <p id="progress-percentage">0%</p>
    </div>

    <script>
        // Django'dan gelen UUID'yi JS değişkenine alıyoruz
        const roomUUID = "{{ room_uuid }}";

        const statusText = document.getElementById('status-text');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const progressPercentage = document.getElementById('progress-percentage');

        // WebSocket Protokolü
        const wsProtocol = window.location.protocol === "https:" ? "wss://" : "ws://";
        const wsUrl = wsProtocol + window.location.host + '/ws/room/' + roomUUID + '/';
        const signalingSocket = new WebSocket(wsUrl);

        // WebRTC Yapılandırması
        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        let peerConnection;
        let dataChannel;
        let receiveBuffer = [];
        let receivedSize = 0;
        let fileMetadata = {};

        signalingSocket.onopen = function(e) {
            console.log("Odaya girildi. Göndericiye hazır olduğumuz bildiriliyor...");
            statusText.innerText = "Gönderici Bekleniyor...";
            signalingSocket.send(JSON.stringify({ 'type': 'ready' }));
        };

        // KRİTİK NOKTA: Buradaki 'async' kelimesi hayati önem taşır
        signalingSocket.onmessage = async function(e) {
            const message = JSON.parse(e.data);

            if (message.offer) {
                peerConnection = new RTCPeerConnection(rtcConfig);

                peerConnection.onicecandidate = event => {
                    if (event.candidate) {
                        signalingSocket.send(JSON.stringify({ 'candidate': event.candidate }));
                    }
                };

                peerConnection.ondatachannel = event => {
                    dataChannel = event.channel;
                    
                    dataChannel.onopen = () => {
                        console.log("Veri kanalı açıldı! Dosya bekleniyor...");
                        statusText.innerText = "Aktarım Başlıyor...";
                        progressContainer.style.display = 'block';
                        progressPercentage.style.display = 'block';
                    };

                    // KRİTİK NOKTA: Buradaki 'async' kelimesi Web Share API için şarttır
                    dataChannel.onmessage = async (event) => {
                        if (typeof event.data === 'string') {
                            const data = JSON.parse(event.data);
                            
                            if (data.type === 'metadata') {
                                fileMetadata = data;
                                receiveBuffer = [];
                                receivedSize = 0;
                                console.log(`Gelecek dosya: ${fileMetadata.fileName}`);
                                
                            } else if (data.type === 'EOF') {
                                console.log("Tüm parçalar alındı. Dosya birleştiriliyor...");
                                statusText.innerText = "Dosya İşleniyor...";
                                
                                const blob = new Blob(receiveBuffer, { type: fileMetadata.fileType });
                                const receivedFile = new File([blob], fileMetadata.fileName, { type: fileMetadata.fileType });

                                // Web Share API Tetikleyicisi
                                if (navigator.canShare && navigator.canShare({ files: [receivedFile] })) {
                                    try {
                                        statusText.innerText = "Kaydetmek için seçin ✅";
                                        // Hatanın kaynağı olan await komutu:
                                        await navigator.share({
                                            files: [receivedFile],
                                            title: fileMetadata.fileName,
                                            text: 'qct üzerinden alınan dosya'
                                        });
                                    } catch (error) {
                                        triggerClassicDownload(blob, fileMetadata.fileName);
                                    }
                                } else {
                                    triggerClassicDownload(blob, fileMetadata.fileName);
                                }
                            }
                        } 
                        else {
                            receiveBuffer.push(event.data);
                            receivedSize += event.data.byteLength;

                            if (fileMetadata.fileSize) {
                                const percentage = Math.round((receivedSize / fileMetadata.fileSize) * 100);
                                progressBar.style.width = percentage + '%';
                                progressPercentage.innerText = percentage + '%';
                                
                                if (percentage === 100) {
                                    statusText.innerText = "Aktarım Tamamlandı!";
                                    progressBar.style.backgroundColor = "#007aff";
                                }
                            }
                        }
                    };
                };

                await peerConnection.setRemoteDescription(new RTCSessionDescription(message.offer));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                signalingSocket.send(JSON.stringify({ 'answer': answer }));
            }

            if (message.candidate) {
                await peerConnection.addIceCandidate(new RTCIceCandidate(message.candidate));
            }
        };

        // Klasik İndirme (Fallback)
        function triggerClassicDownload(blob, fileName) {
            statusText.innerText = "Dosya İndiriliyor... ✅";
            const downloadUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(downloadUrl);
            }, 100);
        }
    </script>

</body>
</html>
