<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QCT - Dosya Gönder</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#007aff">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2916/2916116.png">

    <style>
        /* Modern, sade ve mobil uyumlu CSS mimarisi */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .container {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 30px;
            color: #111;
        }

        /* İşletim sisteminin galerisini tetikleyecek gizli input */
        #file-input {
            display: none;
        }

        /* Kullanıcının göreceği şık buton */
        .btn {
            background-color: #007aff; /* iOS mavi tonu */
            color: white;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            display: inline-block;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3);
        }

        .btn:active {
            transform: scale(0.96);
            background-color: #005bb5;
        }

        #qr-container {
            display: none; /* Başlangıçta gizli */
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            animation: fadeIn 0.5s ease;
        }

        #qrcode {
            padding: 15px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .instruction {
            margin-top: 20px;
            font-size: 15px;
            color: #666;
            line-height: 1.5;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Kurulum Butonu Tasarımı */
        .install-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #333;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s ease, opacity 0.3s ease;
            z-index: 1000;
        }

        .install-btn:hover {
            transform: translateY(-2px);
            background-color: #111;
        }

        /* iOS Kurulum Bilgilendirme Kutusu Tasarımı */
        .ios-popup {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            text-align: center;
            z-index: 1000;
            width: 90%;
            max-width: 350px;
            font-size: 15px;
            line-height: 1.5;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }
        #close-ios-popup {
            margin-top: 12px;
            padding: 8px 20px;
            border: none;
            background: #007aff; /* iOS Mavisi */
            color: white;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <button id="install-btn" class="install-btn" style="display: none;">
        📱 Uygulamayı Yükle
    </button>

    <div id="ios-install-popup" class="ios-popup" style="display: none;">
        🚀 Daha iyi deneyim için:<br>
        Alttaki <b>Paylaş</b> butonuna dokunun ve <br><b>"Ana Ekrana Ekle"</b>yi seçin.
        <button id="close-ios-popup">Anladım</button>
    </div>

    <div class="container">
        <h1 id="status-text">Dosya Paylaş</h1>
        
        <input type="file" id="file-input" accept="image/*, video/*">
        <label for="file-input" class="btn" id="select-btn">Galeriden Seç</label>

        <div id="qr-container">
            <div id="qrcode"></div>
            <p class="instruction">Alıcı cihazın kamerasıyla<br>bu QR kodu okutun.</p>
        </div>
    </div>

    <script>
        // PWA Service Worker Kaydı
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(reg => console.log('Service Worker başarıyla kaydedildi.', reg.scope))
                    .catch(err => console.error('Service Worker kaydı başarısız:', err));
            });
        }

        const fileInput = document.getElementById('file-input');
        const selectBtn = document.getElementById('select-btn');
        const qrContainer = document.getElementById('qr-container');
        const statusText = document.getElementById('status-text');

        // --- WAKE LOCK API (Ekran Kapanmasını Önleme Motoru) ---
        let wakeLock = null;
        let isTransferActive = false; // Aktarımın durumunu takip edeceğiz
        let isTransferSuccess = false; // YENİ: Başarı Bayrağı

        const requestWakeLock = async () => {
            try {
                if ('wakeLock' in navigator) {
                    // Sadece sayfa aktif/görünür ise kilidi iste (Çökmeyi engeller)
                    if (document.visibilityState === 'visible') {
                        wakeLock = await navigator.wakeLock.request('screen');
                        console.log('Ekran kilidi (Wake Lock) aktif edildi. Ekran kapanmayacak.');
                        
                        // İşletim sistemi pili korumak için kilidi zorla açarsa bunu yakala
                        wakeLock.addEventListener('release', () => {
                            console.log('Ekran kilidi (Wake Lock) sistem tarafından serbest bırakıldı.');
                        });
                    } else {
                        console.warn('Sayfa arka planda olduğu için Wake Lock şu an alınamadı.');
                    }
                } else {
                    console.warn('Bu tarayıcı Wake Lock API desteklemiyor (Örn: Eski Safari sürümleri).');
                }
            } catch (err) {
                console.error(`Wake Lock Hatası: ${err.name}, ${err.message}`);
            }
        };

        // Ekstra Güvenlik: Kullanıcı sekmeye geri döndüğünde kilidi tekrar almaya çalış
        document.addEventListener('visibilitychange', () => {
            if (wakeLock === null && document.visibilityState === 'visible') {
                requestWakeLock();
            }
        },  { passive: true });

        const releaseWakeLock = async () => {
            if (wakeLock !== null) {
                await wakeLock.release();
                wakeLock = null;
                console.log('Aktarım bitti/durdu. Ekran kilidi kaldırıldı.');
            }
            isTransferActive = false;
        };

        // MÜHENDİSLİK DOKUNUŞU: Kullanıcı sekmeyi alta alıp (küçültüp) tekrar açarsa
        // İşletim sistemi kilidi düşürür. Sekme geri açıldığında aktarım devam ediyorsa kilidi yenile!
        document.addEventListener('visibilitychange', async () => {
            if (isTransferActive && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });

        fileInput.addEventListener('change', function(e) {
            // Kullanıcı bir dosya seçtiyse işlemleri başlat
            if (e.target.files.length > 0) {
                const selectedFile = e.target.files[0];
                
                // 1. Rastgele benzersiz bir UUID üret
                const uuid = crypto.randomUUID();
                
                // 2. Bağlantı URL'sini dinamik oluştur
                // window.location.host sayesinde canlıda domaini, testte localhost'u otomatik alır.
                const protocol = window.location.protocol;
                const host = window.location.host;
                const receiveUrl = `${protocol}//${host}/al/${uuid}`;

                // 3. Arayüzü QR kod gösterimine göre güncelle
                selectBtn.style.display = 'none'; // Butonu gizle
                statusText.innerText = 'Bağlantı Bekleniyor...';
                qrContainer.style.display = 'flex'; // QR kod alanını göster

                // 4. QR Kodu Ekrana Bas
                new QRCode(document.getElementById("qrcode"), {
                    text: receiveUrl,
                    width: 220,
                    height: 220,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });

                // Mühendislik Notu: Dosya şimdilik tarayıcı RAM'inde bekliyor.
                // Faz 4'te WebRTC bağlandığında bu değişkenleri kullanarak veriyi karşıya akıtacağız.
                window.fileToTransfer = selectedFile;
                window.roomUUID = uuid;
                // WebSocket Bağlantısını Kur
                const wsProtocol = window.location.protocol === "https:" ? "wss://" : "ws://";
                const signalingSocket = new WebSocket(`${wsProtocol}${window.location.host}/ws/room/${window.roomUUID}/`);

                signalingSocket.onopen = () => {
                    console.log("Sinyalleşme sunucusuna bağlanıldı. Alıcı bekleniyor...");
                };

                signalingSocket.onclose = function(e) {
                    console.warn("WebSocket kapandı. Kapanma Kodu (Code):", e.code); 
                    
                    // Değişkeni Dışarı Çıktı 4004 de bunu görebilecek.
                    const statusEl = document.getElementById('status-text');
                    
                    if (e.code === 4003) {
                        console.error("Bağlantı reddedildi: Oda dolu veya meşgul.");
                        if (statusEl) {
                            statusEl.innerText = "Bağlantı Meşgul! 🚫 (Bu oda şu an dolu)";
                            statusEl.style.color = "#ff3b30";
                        }
                    } 
                    else if (e.code === 4004) {
                        console.error("Bağlantı reddedildi: Link imha edilmiş.");
                        if (statusEl) {
                            statusEl.innerText = "Bu Bağlantı Geçersiz!";
                            statusEl.style.color = "#ff3b30";
                        }
                    }
                    // GÜVENLİK AĞI (Tarayıcı sansürüne karşı)
                    else {
                        if (statusEl && (statusEl.innerText.includes("Bekleniyor") || statusEl.innerText.includes("Bağlanıyor"))) {
                            console.error("Sunucu bağlantıyı kesti (Link ölü veya koptu).");
                            statusEl.innerText = "Bağlantı Koptu veya Geçersiz ❌";
                            statusEl.style.color = "#ff3b30";
                        }
                    }
                };

                signalingSocket.onmessage = async (e) => {
                    const message = JSON.parse(e.data);

                    // --- KAMİKAZE KONTROLÜ: Karşı taraf sayfayı yeniledi veya koptu ---
                    if (message.type === 'room_killed') {
                        console.error("Karşı taraf ayrıldı. Oda imha ediliyor.");
                        if (!isTransferSuccess) {
                            const statusEl = document.getElementById('status-text');
                            
                            // Eğer işlem çoktan BAŞARILI olmadıysa kırmızı hatayı bas
                            if (statusEl && !statusEl.innerText.includes("Başarılı") && !statusEl.innerText.includes("Tamamlandı")) {
                                statusEl.innerText = "Karşı Taraf Koptu ❌ Lütfen baştan QR oluşturun.";
                                statusEl.style.color = "#ff3b30";
                            }
                        }

                        // HER ŞEYİ TEMİZLE VE BAĞLANTILARI KOPAR
                        if (peerConnection) peerConnection.close();
                        if (signalingSocket) signalingSocket.close();
                        if (typeof releaseWakeLock === 'function') releaseWakeLock();
                        if (window.heartbeatInterval) clearInterval(window.heartbeatInterval);
                        window.fileToTransfer = null; // BELLEĞİ SIFIRLA
                        return;
                    }

                    // 1. Alıcı odaya girdiğinde "ready" mesajı atacak, biz de WebRTC'yi başlatacağız.
                    if (message.type === 'ready') {
                        if (isTransferFinished) {
                            console.warn("🔒 Güvenlik: Bu dosya zaten başarıyla gönderildi. Yeni transfer reddedildi.");
                            return;
                        }

                        if (peerConnection && (
                            peerConnection.iceConnectionState === 'connected' || 
                            peerConnection.iceConnectionState === 'checking' ||
                            peerConnection.iceConnectionState === 'completed'
                            )) {
                                console.warn("🔒 Güvenlik: Zaten aktif bir aktarım var! Dışarıdan gelen 'ready' sinyali reddedildi.");
                                return; // Kodun aşağısına inme, yeni tünel YARATMA!
                        }
                                
                        console.log("Alıcı bağlandı, WebRTC bağlantısı başlatılıyor...");
                        
                        peerConnection = new RTCPeerConnection(rtcConfig);
                        
                        // --- 1. HATA YÖNETİMİ: BAĞLANTI KOPMASINI YAKALA ---
                        peerConnection.oniceconnectionstatechange = () => {
                            console.log("WebRTC Bağlantı Durumu:", peerConnection.iceConnectionState);
                            
                            if (peerConnection.iceConnectionState === "disconnected" || 
                                peerConnection.iceConnectionState === "failed" || 
                                peerConnection.iceConnectionState === "closed") {
                                
                                // Django'ya "Odayı Yok Et" sinyali gönder
                                if (signalingSocket && signalingSocket.readyState === WebSocket.OPEN) {
                                    signalingSocket.send(JSON.stringify({ type: 'kill_room' }));
                                }

                                // Kullanıcıya kırmızı bir uyarı ver
                                // Kamikaze Uyarı Bloğu: SADECE BAŞARISIZSA KIRMIZI YAZ
                                if (!isTransferSuccess) {
                                    const statusEl = document.getElementById('status-text');
                                    if (statusEl) {
                                        statusEl.innerText = "Bağlantı Koptu! ❌ Lütfen sayfayı yenileyin.";
                                        statusEl.style.color = "#ff3b30";
                                    }
                                }

                                // KENDİ BELLEĞİNİ VE BAĞLANTILARINI SIFIRLA
                                if (peerConnection) peerConnection.close();
                                if (signalingSocket) signalingSocket.close();

                                // Transfer yarım kaldıysa ekran kilidini (Wake Lock) zorla kaldır ki şarj gitmesin
                                if (typeof releaseWakeLock === 'function') releaseWakeLock();
                                
                                // (Varsa) Kalp atışını durdur
                                if (window.heartbeatInterval) clearInterval(window.heartbeatInterval);
                                window.fileToTransfer = null;
                            }
                        };

                        // ICE Adaylarını yakala ve alıcıya gönder
                        peerConnection.onicecandidate = event => {
                            if (event.candidate) {
                                signalingSocket.send(JSON.stringify({ 'candidate': event.candidate }));
                            }
                        };

                        // Dosya aktarımı için Data Channel'ı YARAT
                        dataChannel = peerConnection.createDataChannel('fileTransfer', { ordered: true });
                        
                        // --- EKSİK OLAN KALP ATIŞI (HEARTBEAT) DİNLEYİCİSİ ---
                        dataChannel.onmessage = (event) => {
                            if (typeof event.data === 'string') {
                                const data = JSON.parse(event.data);
                                if (data.type === 'ping') {
                                    // Alıcı ping attı, hemen pong ile cevap ver
                                    if (dataChannel.readyState === 'open') {
                                        dataChannel.send(JSON.stringify({ type: 'pong' }));
                                    }
                                } else if (data.type === 'pong') {
                                    // Alıcıdan pong geldi
                                    console.log("💚 Heartbeat: Pong alındı. Alıcı hatta ve sapasağlam.");
                                }
                            }
                        };

                        dataChannel.onopen = () => {
                            console.log("Veri kanalı açıldı! Dosya gönderimi başlıyor...");
                            statusText.innerText = "Bağlantı Kuruldu. Dosya Gönderiliyor...";

                            // DataChannel açıldığında Kalp Atışını (Heartbeat) başlat
                            window.heartbeatInterval = setInterval(() => {
                                if (dataChannel.readyState === 'open') {
                                    dataChannel.send(JSON.stringify({ type: 'ping' }));
                                    console.log("💓 Heartbeat: Ping gönderildi");
                                }
                            }, 10000); // 10 saniyede bir tetiklenir
                            
                            const file = window.fileToTransfer;
                            if (!file) {
                                console.error("Gönderilecek dosya bulunamadı!");
                                return;
                            }
                            
                            // AKTARIM BAŞLADI: Ekran kilidini vur!
                            isTransferActive = true;
                            requestWakeLock();
                            
                            // 1. Önce Alıcıya Metadata gönder
                            const metadata = {
                                type: 'metadata',
                                fileName: file.name,
                                fileSize: file.size,
                                fileType: file.type
                            };
                            dataChannel.send(JSON.stringify(metadata));

                            // 2. Parçalama (Chunking) ve BACKPRESSURE Ayarları
                            const CHUNK_SIZE = 64 * 1024; // 64 KB'lık mermiler
                            const MAX_BUFFER_SIZE = 1024 * 1024; // 1 MB: RAM'i koruyan üst sınır
                            dataChannel.bufferedAmountLowThreshold = 1024 * 512; // 512 KB: Yeniden gaza basma sınırı

                            let offset = 0;
                            const reader = new FileReader();

                            // 3. Dosyayı dilimleme (Slice) ve okuma motoru
                            const readSlice = () => {
                                // Eğer aktarım bittiyse motoru durdur
                                if (offset >= file.size) return;

                                // KRİTİK NOKTA: BACKPRESSURE KONTROLÜ
                                // Eğer WebRTC bekleme odası 1 MB'ı aştıysa, okumayı DURDUR.
                                if (dataChannel.bufferedAmount > MAX_BUFFER_SIZE) {
                                    console.log("Ağ yavaşladı, tampon doldu. Okuma bekletiliyor...");
                                    return; // Çıkış yap, onbufferedamountlow eventini bekle
                                }

                                const slice = file.slice(offset, offset + CHUNK_SIZE);
                                reader.readAsArrayBuffer(slice);
                            };

                            // 4. Her bir parça okunduğunda tetiklenen olay
                            reader.onload = function(e) {
                                // Okunan parçayı kanaldan fırlat
                                dataChannel.send(e.target.result);
                                offset += CHUNK_SIZE;

                                // Dosyanın tamamı bitmediyse motoru döndürmeye devam et
                                if (offset < file.size) {
                                    readSlice(); 
                                } else {
                                    // 5. Dosya tamamen bittiğinde 'EOF' sinyali gönder
                                    console.log("Dosya aktarımı tamamlandı. EOF sinyali gönderildi.");
                                    dataChannel.send(JSON.stringify({ type: 'EOF' }));
                                    
                                    // Arayüzü güncelle
                                    statusText.innerText = "Gönderim Başarılı! ✅";
                                    statusText.style.color = "#34c759";

                                    // AKTARIM BİTTİ: Ekran kilidini serbest bırak!
                                    releaseWakeLock();

                                    // YENİ EKLENEN: Aktarım bitti, kalp atışını da durdur ki boşuna çalışmasın
                                   if (window.heartbeatInterval) {
                                       clearInterval(window.heartbeatInterval);
                                    }

                                    // MÜHRÜ VUR: Bu oda artık yeni gönderim yapamaz
                                    isTransferFinished = true;

                                    // ZAMAN AYARLI BOMBA YERİNE "AKILLI ŞALTER" (BUFFER KONTROLÜ)
                                    const closeConnectionSafely = () => {
                                        // Eğer tarayıcının gönderme kuyruğunda hiç veri kalmadıysa (0 byte ise)
                                        if (dataChannel.bufferedAmount === 0) {
                                            isTransferSuccess = true; // BAŞARI BAYRAĞINI DİK!

                                            // YENİ: DJANGO'YA ÖLÜM FERMANINI (KARA LİSTE EMRİNİ) GÖNDER!
                                            if (signalingSocket && signalingSocket.readyState === WebSocket.OPEN) {
                                                signalingSocket.send(JSON.stringify({ type: 'transfer_complete' }));
                                            }

                                            if (peerConnection) peerConnection.close();
                                            if (signalingSocket) signalingSocket.close();
                                            console.log("Son byte'a kadar iletildi. Oda güvenli bir şekilde imha edildi.");
                                        } else {
                                            // Hala kuyrukta veri varsa, yarım saniye bekle ve tekrar kontrol et
                                            console.log(`Tampon boşalıyor... Kalan: ${dataChannel.bufferedAmount} byte`);
                                            setTimeout(closeConnectionSafely, 500); 
                                        }
                                    };

                                    // Akıllı şalteri çalıştır
                                    closeConnectionSafely();
                                    
                                    // Zafer Anı: İşlem bitti, iOS PWA kurulumunu önerebiliriz
                                    if (typeof triggerIosPrompt === "function") {
                                        triggerIosPrompt();
                                    }
                                }
                            };

                            // KRİTİK NOKTA 2: TAMPON BOŞALDI TETİKLEYİCİSİ
                            // WebRTC biriken veriyi karşıya iletip rahatladığında (512 KB'ın altına düştüğünde) bizi uyarır
                            dataChannel.onbufferedamountlow = () => {
                                console.log("Tampon boşaldı. Gönderime kaldığı yerden devam ediliyor...");
                                readSlice(); // Motoru tekrar çalıştır
                            };

                            // Sistemi başlat: İlk parçayı oku
                            readSlice();
                        };

                        // SDP Offer oluştur ve alıcıya gönder
                        const offer = await peerConnection.createOffer();
                        await peerConnection.setLocalDescription(offer);
                        signalingSocket.send(JSON.stringify({ 'offer': offer }));
                    }

                    // 2. Alıcıdan gelen Answer'ı kabul et
                    if (message.answer) {
                        try {
                            // WebRTC'nin kendi zırhı: Sadece "cevap bekliyorsam" uygula
                            if (peerConnection.signalingState === "have-local-offer") {
                                await peerConnection.setRemoteDescription(new RTCSessionDescription(message.answer));
                            }
                        } catch (err) {
                            console.warn("Gecikmeli veya geçersiz Answer yoksayıldı:", err.message);
                        }
                    }

                    // 3. Alıcıdan gelen ICE adaylarını (Ağ koordinatları) ekle
                    if (message.candidate) {
                        try {
                            // Sadece gerçek bir rota ise ekle
                            if (peerConnection && peerConnection.signalingState !== "closed") {
                                await peerConnection.addIceCandidate(new RTCIceCandidate(message.candidate));
                            }
                        } catch (err) {
                            console.warn("Geçersiz ICE rotası yoksayıldı:", err.message);
                        }
                    }
                };
                
                console.log("Oluşturulan URL:", receiveUrl);
            }
        });
        // WebRTC Yapılandırması (Google STUN Sunucuları)
        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        let peerConnection;
        let dataChannel;
        let isTransferFinished = false; // Aktarımın bitip bitmediğini tutan mühür

        // PWA Kurulum Kontrolü (Custom Install Prompt)
        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');

        // 1. Tarayıcının varsayılan pop-up'ını engelle ve olayı kaydet
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); // Varsayılanı durdur
            deferredPrompt = e; // Olayı (event) cebimize koy
            
            // 2. Kendi şık butonumuzu görünür yap
            installBtn.style.display = 'block';
        });

        // 3. Kullanıcı kendi isteğiyle butonumuza tıkladığında
        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                // Tarayıcının kurulum menüsünü ŞİMDİ tetikle
                deferredPrompt.prompt();
                
                // Kullanıcının kararını bekle
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('Kullanıcı uygulamayı kurmayı kabul etti.');
                } else {
                    console.log('Kullanıcı kurulumu reddetti.');
                }
                
                // İşlem bitti, butonu ve prompt'u temizle
                deferredPrompt = null;
                installBtn.style.display = 'none';
            }
        });

        // Zaten kurulmuşsa veya kurulum tamamlandığında butonu gizle
        window.addEventListener('appinstalled', () => {
            installBtn.style.display = 'none';
            console.log('QCT başarıyla ana ekrana kuruldu!');
        });

        // Akıllı iOS Kurulum Tetikleyicisi (Sadece çağrıldığında çalışır)
        function triggerIosPrompt() {
            const isIos = /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
            const isInStandaloneMode = ('standalone' in window.navigator) && (window.navigator.standalone);

            if (isIos && !isInStandaloneMode) {
                const iosPopup = document.getElementById('ios-install-popup');
                iosPopup.style.display = 'block';
                
                document.getElementById('close-ios-popup').addEventListener('click', () => {
                    iosPopup.style.display = 'none';
                }, { once: true }); // Butona basılınca dinleyiciyi temizle
            }
        }

        // KASITLI ÇIKIŞ YAKALAYICI (ZIRHLI VERSİYON)
        window.addEventListener('beforeunload', () => {
            // 1. typeof ile değişkenin tanımlanıp tanımlanmadığını kontrol et (Çökmeyi engeller)
            // 2. Eğer tanımlıysa ve bağlantı açıksa intihar emrini ver
            if (typeof signalingSocket !== 'undefined' && signalingSocket && signalingSocket.readyState === WebSocket.OPEN) {
                signalingSocket.send(JSON.stringify({ type: 'kill_room' }));
            }
        });
    </script>
