<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QCT - Receive File</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#007aff">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2916/2916116.png">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .container {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        #status-text {
            font-size: 22px;
            margin-bottom: 20px;
            color: #111;
            font-weight: 600;
        }

        /* İndirme Çubuğu (Progress Bar) Tasarımı */
        #progress-container {
            display: none; /* Başlangıçta gizli, transfer başlayınca açılacak */
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 20px;
            height: 20px;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background-color: #34c759; /* iOS Yeşil tonu */
            transition: width 0.3s ease;
        }

        #progress-percentage {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
            display: none;
        }

        /* Kurulum Butonu Tasarımı */
        .install-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #333;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s ease, opacity 0.3s ease;
            z-index: 1000;
        }

        .install-btn:hover {
            transform: translateY(-2px);
            background-color: #111;
        }

        /* iOS Kurulum Bilgilendirme Kutusu Tasarımı */
        .ios-popup {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            text-align: center;
            z-index: 1000;
            width: 90%;
            max-width: 350px;
            font-size: 15px;
            line-height: 1.5;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        #close-ios-popup {
            margin-top: 12px;
            padding: 8px 20px;
            border: none;
            background: #007aff; /* iOS Mavisi */
            color: white;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <button id="install-btn" class="install-btn" style="display: none;">
        📱 Uygulamayı Yükle
    </button>

    <div id="ios-install-popup" class="ios-popup" style="display: none;">
        🚀 Daha iyi deneyim için:<br>
        Alttaki <b>Paylaş</b> butonuna dokunun ve <br><b>"Ana Ekrana Ekle"</b>yi seçin.
        <button id="close-ios-popup">Anladım</button>
    </div>
    
    <div class="container">
        <h1 id="status-text">Connecting...</h1>
        
        <div id="progress-container">
            <div id="progress-bar"></div>
        </div>
        <p id="progress-percentage">0%</p>
    </div>

    <script>
        // PWA Service Worker Kaydı
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(reg => console.log('Service Worker başarıyla kaydedildi.', reg.scope))
                    .catch(err => console.error('Service Worker kaydı başarısız:', err));
            });
        }

        // 1. INDEXEDDB (DİSK DEPOLAMA) KURULUMU
        const dbName = "QCTFileStorage";
        const storeName = "fileChunks";
        let db;

        // --- WAKE LOCK API (Ekran Kapanmasını Önleme Motoru) ---
        let wakeLock = null;
        let isTransferActive = false; // Aktarımın durumunu takip edeceğiz

        const requestWakeLock = async () => {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Ekran kilidi (Wake Lock) aktif edildi. Ekran kapanmayacak.');
                    
                    // İşletim sistemi pili korumak için kilidi zorla açarsa bunu yakala
                    wakeLock.addEventListener('release', () => {
                        console.log('Ekran kilidi (Wake Lock) sistem tarafından serbest bırakıldı.');
                    });
                } else {
                    console.warn('Bu tarayıcı Wake Lock API desteklemiyor (Örn: Eski Safari sürümleri).');
                }
            } catch (err) {
                console.error(`Wake Lock Hatası: ${err.name}, ${err.message}`);
            }
        };

        const releaseWakeLock = async () => {
            if (wakeLock !== null) {
                await wakeLock.release();
                wakeLock = null;
                console.log('Aktarım bitti/durdu. Ekran kilidi kaldırıldı.');
            }
            isTransferActive = false;
        };

        // MÜHENDİSLİK DOKUNUŞU: Kullanıcı sekmeyi alta alıp (küçültüp) tekrar açarsa
        // İşletim sistemi kilidi düşürür. Sekme geri açıldığında aktarım devam ediyorsa kilidi yenile!
        document.addEventListener('visibilitychange', async () => {
            if (isTransferActive && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });

        const initDB = () => {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(dbName, 1);
                request.onupgradeneeded = (e) => {
                    db = e.target.result;
                    if (!db.objectStoreNames.contains(storeName)) {
                        db.createObjectStore(storeName, { autoIncrement: true });
                    }
                };
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve();
                };
                request.onerror = (e) => reject(e.target.error);
            });
        };

        // Sayfa yüklendiğinde Veritabanını hazırla
        initDB().then(() => console.log("IndexedDB (Disk Depolama) başarıyla hazırlandı."));

        // Django'dan gelen UUID'yi JS değişkenine alıyoruz
        const roomUUID = "{{ room_uuid }}";

        const statusText = document.getElementById('status-text');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const progressPercentage = document.getElementById('progress-percentage');

        // WebSocket Protokolü
        const wsProtocol = window.location.protocol === "https:" ? "wss://" : "ws://";
        const wsUrl = wsProtocol + window.location.host + '/ws/room/' + roomUUID + '/';
        const signalingSocket = new WebSocket(wsUrl);

        // WebRTC Yapılandırması
        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        let peerConnection;
        let dataChannel;
        // receiveBuffer SİLİNDİ, RAM ARTIK RAHAT!
        let receivedSize = 0;
        let fileMetadata = {};

        signalingSocket.onopen = function(e) {
            console.log("Odaya girildi. Göndericiye hazır olduğumuz bildiriliyor...");
            statusText.innerText = "Gönderici Bekleniyor...";
            signalingSocket.send(JSON.stringify({ 'type': 'ready' }));
        };

        // KRİTİK NOKTA: Buradaki 'async' kelimesi hayati önem taşır
        signalingSocket.onmessage = async function(e) {
            const message = JSON.parse(e.data);

            if (message.offer) {
                peerConnection = new RTCPeerConnection(rtcConfig);

                // --- 1. HATA YÖNETİMİ: BAĞLANTI KOPMASINI YAKALA ---
                peerConnection.oniceconnectionstatechange = () => {
                    console.log("WebRTC Bağlantı Durumu:", peerConnection.iceConnectionState);
                    
                    if (peerConnection.iceConnectionState === "disconnected" || 
                        peerConnection.iceConnectionState === "failed" || 
                        peerConnection.iceConnectionState === "closed") {
                        
                        // Kullanıcıya kırmızı bir uyarı ver
                        const statusEl = document.getElementById('status-text');
                        if (statusEl) {
                            statusEl.innerText = "Bağlantı Koptu! ❌ Lütfen sayfayı yenileyin.";
                            statusEl.style.color = "#ff3b30"; // Kırmızı uyarı rengi
                        }

                        // Transfer yarım kaldıysa ekran kilidini (Wake Lock) zorla kaldır ki şarj gitmesin
                        if (typeof releaseWakeLock === 'function') releaseWakeLock();
                        
                        // (Varsa) Kalp atışını durdur
                        if (typeof heartbeatInterval !== 'undefined') clearInterval(heartbeatInterval);
                    }
                };

                peerConnection.onicecandidate = event => {
                    if (event.candidate) {
                        signalingSocket.send(JSON.stringify({ 'candidate': event.candidate }));
                    }
                };

                peerConnection.ondatachannel = event => {
                    dataChannel = event.channel;
                    
                    dataChannel.onopen = () => {
                        console.log("Veri kanalı açıldı! Dosya bekleniyor...");
                        statusText.innerText = "Aktarım Başlıyor...";
                        progressContainer.style.display = 'block';
                        progressPercentage.style.display = 'block';

                        // DataChannel açıldığında Kalp Atışını (Heartbeat) başlat
                        window.heartbeatInterval = setInterval(() => {
                            if (dataChannel.readyState === 'open') {
                                dataChannel.send(JSON.stringify({ type: 'ping' }));
                                console.log("💓 Heartbeat: Ping gönderildi");
                            }
                        }, 10000); // 10 saniyede bir tetiklenir

                        // AKTARIM BAŞLADI: Ekran kilidini vur!
                        isTransferActive = true;
                        requestWakeLock();
                    };

                    // 2. YENİ INDEXEDDB YAZMA VE OKUMA MOTORU
                    dataChannel.onmessage = async (event) => {
                        // A. Gelen Veri Metin/JSON ise (Metadata veya EOF sinyali)
                        if (typeof event.data === 'string') {
                            const data = JSON.parse(event.data);
                            
                            if (data.type === 'ping') {
                            // Karşıdan ping geldi, hemen pong göndererek 'Yaşıyorum' de
                            if (dataChannel.readyState === 'open') {
                                dataChannel.send(JSON.stringify({ type: 'pong' }));
                            }
                            return; // Kodun aşağısına inme, burada bitir
                        } else if (data.type === 'pong') {
                            console.log("💚 Heartbeat: Pong alındı. Bağlantı sapasağlam.");
                            return; // Kodun aşağısına inme
                        }

                            if (data.type === 'metadata') {
                                fileMetadata = data;
                                receivedSize = 0;
                                console.log(`Gelecek dosya: ${fileMetadata.fileName}`);
                                
                                // Yeni dosya için diski temizle
                                const transaction = db.transaction([storeName], "readwrite");
                                transaction.objectStore(storeName).clear();
                                
                            } else if (data.type === 'EOF') {
                                console.log("Tüm parçalar diske yazıldı. Dosya birleştiriliyor...");
                                statusText.innerText = "Dosya İşleniyor (Lütfen Bekleyin)...";
                                
                                // Diskteki parçaları oku
                                const transaction = db.transaction([storeName], "readonly");
                                const store = transaction.objectStore(storeName);
                                const request = store.getAll();
                                
                                request.onsuccess = async (e) => {
                                    const chunks = e.target.result;
                                    const blob = new Blob(chunks, { type: fileMetadata.fileType });
                                    const receivedFile = new File([blob], fileMetadata.fileName, { type: fileMetadata.fileType });

                                    // Web Share API Tetikleyicisi
                                    if (navigator.canShare && navigator.canShare({ files: [receivedFile] })) {
                                        try {
                                            statusText.innerText = "Kaydetmek için seçin ✅";
                                            await navigator.share({
                                                files: [receivedFile],
                                                title: fileMetadata.fileName,
                                                text: 'QCT üzerinden alınan dosya'
                                            });
                                        } catch (error) {
                                            triggerClassicDownload(blob, fileMetadata.fileName);
                                        }
                                    } else {
                                        triggerClassicDownload(blob, fileMetadata.fileName);
                                    }
                                    
                                    // Zafer Anı: Dosya teslim edildi, iOS kullanıcısına kurulumu öner
                                    triggerIosPrompt();

                                    // TEMİZLİK: Diskteki kalıntıları sil
                                    const clearTx = db.transaction([storeName], "readwrite");
                                    clearTx.objectStore(storeName).clear();
                                    chunks.length = 0;

                                    // AKTARIM BİTTİ: Ekran kilidini serbest bırak!
                                    releaseWakeLock();
                                };
                            }
                        } 
                        // B. Gelen Veri ArrayBuffer (Dosya Parçası) ise -> RAM'E DEĞİL DİSKE YAZ
                        else {
                            const transaction = db.transaction([storeName], "readwrite");
                            transaction.objectStore(storeName).put(event.data);
                            
                            receivedSize += event.data.byteLength;

                            if (fileMetadata.fileSize) {
                                const percentage = Math.round((receivedSize / fileMetadata.fileSize) * 100);
                                progressBar.style.width = percentage + '%';
                                progressPercentage.innerText = percentage + '%';
                                
                                if (percentage === 100) {
                                    statusText.innerText = "Aktarım Tamamlandı, Birleştiriliyor...";
                                    progressBar.style.backgroundColor = "#007aff";
                                }
                            }
                        }
                    };
                };

                await peerConnection.setRemoteDescription(new RTCSessionDescription(message.offer));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                signalingSocket.send(JSON.stringify({ 'answer': answer }));
            }

            if (message.candidate) {
                await peerConnection.addIceCandidate(new RTCIceCandidate(message.candidate));
            }
        };

        // Klasik İndirme (Fallback)
        function triggerClassicDownload(blob, fileName) {
            statusText.innerText = "Dosya İndiriliyor... ✅";
            const downloadUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(downloadUrl);
            }, 100);
        }

        // PWA Kurulum Kontrolü (Custom Install Prompt)
        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); 
            deferredPrompt = e; 
            installBtn.style.display = 'block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('Kullanıcı uygulamayı kurmayı kabul etti.');
                } else {
                    console.log('Kullanıcı kurulumu reddetti.');
                }
                deferredPrompt = null;
                installBtn.style.display = 'none';
            }
        });

        window.addEventListener('appinstalled', () => {
            installBtn.style.display = 'none';
            console.log('QCT başarıyla ana ekrana kuruldu!');
        });

        // Akıllı iOS Kurulum Tetikleyicisi
        function triggerIosPrompt() {
            const isIos = /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
            const isInStandaloneMode = ('standalone' in window.navigator) && (window.navigator.standalone);

            if (isIos && !isInStandaloneMode) {
                const iosPopup = document.getElementById('ios-install-popup');
                iosPopup.style.display = 'block';
                
                document.getElementById('close-ios-popup').addEventListener('click', () => {
                    iosPopup.style.display = 'none';
                }, { once: true });
            }
        }
    </script>

</body>
</html>
